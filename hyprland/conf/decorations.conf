general {
    col.active_border = rgb($main) 
    col.inactive_border = rgb($alt)

    gaps_in = 5
    gaps_out = 15

    border_size = 2

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

decoration {
    rounding = 15
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = 0x66000000
    }
 
    blur {
        enabled = true
        size = 7
        passes = 3
        ignore_opacity = true
        noise = 0
        contrast=1.5
        xray = false 
        new_optimizations = true
     } 
}