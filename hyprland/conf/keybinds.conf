$mainMod = SUPER

# Menus and apps
bindd = $mainMod ALT, SPACE, Open Hyprlab Menu, exec, hyprlab menu
bindd = $mainMod, SPACE, Open App Menu, exec, $menu
bindd = $mainMod, A, Open Terminal, exec, $TERMINAL
bindd = $mainMod SHIFT, A, Open Floating Terminal, exec, $TERMINAL --class "float"
bindd = $mainMod, B, Open Browser, exec, $browser
bindd = $mainMod, Q, Close Window, killactive
bindd = $mainMod, E, Open File Manager, exec, $fileManager
bindd = $mainMod, F, Toggle Fullscreen, fullscreen
bindd = $mainMod, V, Toggle Floating, togglefloating
bindd = $mainMod, P, Toggle Pseudotile, pseudo
bindd = $mainMod, J, Toggle Split, togglesplit
bindd = $mainMod, L, Open Power Menu, exec, wlogout -b 4
bindd = $mainMod ALT, O, Open Options Menu, exec, hyprlab menu options
bindd = $mainMod, T, Open Theme Menu, exec, hyprlab menu themes
bindd = $mainMod, W, Open Waybar Menu, exec, hyprlab menu waybar
bindd = $mainMod, X, Open Wallpaper Menu, exec, hyprlab menu wall
bindd = $mainMod, C, Open Wallpapers Menu, exec, hyprlab menu walls

# Screenshots
bindd = $mainMod, PRINT, Screenshot Window, exec, hyprshot -m window
bindd = , PRINT, Screenshot Output, exec, hyprshot -m output
bindd = SHIFT, PRINT, Screenshot Region, exec, hyprshot -m region

# Focus movement
bindd = $mainMod ALT, left, Focus Left, movefocus, l
bindd = $mainMod ALT, right, Focus Right, movefocus, r
bindd = $mainMod ALT, up, Focus Up, movefocus, u
bindd = $mainMod ALT, down, Focus Down, movefocus, d

# Window movement
bindd = $mainMod, left, Move Window Left, movewindow, l
bindd = $mainMod, right, Move Window Right, movewindow, r
bindd = $mainMod, up, Move Window Up, movewindow, u
bindd = $mainMod, down, Move Window Down, movewindow, d

# Workspace switching
bindd = $mainMod, ampersand, Workspace 1, workspace, 1
bindd = $mainMod, eacute, Workspace 2, workspace, 2
bindd = $mainMod, quotedbl, Workspace 3, workspace, 3
bindd = $mainMod, apostrophe, Workspace 4, workspace, 4
bindd = $mainMod, parenleft, Workspace 5, workspace, 5
bindd = $mainMod, egrave, Workspace 6, workspace, 6
bindd = $mainMod, minus, Workspace 7, workspace, 7
bindd = $mainMod, underscore, Workspace 8, workspace, 8
bindd = $mainMod, ccedilla, Workspace 9, workspace, 9
bindd = $mainMod, agrave, Workspace 10, workspace, 10

# Move window to workspace
bindd = $mainMod SHIFT, ampersand, Move To Workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, eacute, Move To Workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, quotedbl, Move To Workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, apostrophe, Move To Workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, parenleft, Move To Workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, egrave, Move To Workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, minus, Move To Workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, underscore, Move To Workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, ccedilla, Move To Workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, agrave, Move To Workspace 10, movetoworkspace, 10

# Special workspace
bindd = $mainMod SHIFT, N, Toggle AI Workspace, togglespecialworkspace, ai

# Workspace scrolling
bindd = $mainMod, mouse_down, Next Workspace, workspace, e+1
bindd = $mainMod, mouse_up, Previous Workspace, workspace, e-1

# Mouse actions
bindmd = $mainMod, mouse:272, Move Window, movewindow
bindmd = $mainMod, mouse:273, Resize Window, resizewindow
