$mainMod = SUPER 

#bind = key1, key2, action #keybind definition 

bind = $mainMod ALT, SPACE, exec, hyprlab menu #Show the hyprlab menu
bind = $mainMod, SPACE, exec, $menu #show the app menu
bind = $mainMod, A, exec, $TERMINAL #run default terminal
bind = $mainMod SHIFT, A, exec, $TERMINAL --class "float" #run and float default terminal
bind = $mainMod, B, exec, $browser #run default browser
bind = $mainMod, Q, killactive #kill active window
bind = $mainMod, E, exec, $fileManager #run default file manager
bind = $mainMod, F, fullscreen #full screen a window
bind = $mainMod, V, togglefloating #toggle floating for the active window
bind = $mainMod, P, pseudo, # toggle pseudo layout 
bind = $mainMod, J, togglesplit, # toggle split layout
bind = $mainMod, L, exec, wlogout -b 4 #Show the power menu
bind = $mainMod ALT, O, exec, hyprlab menu options #Show options menu
bind = $mainMod, T, exec, hyprlab menu themes #Theme menu
bind = $mainMod, W, exec, hyprlab menu waybar #Waybar menu
bind = $mainMod, X, exec, hyprlab menu wall #Theme wallpapers menu
bind = $mainMod, C, exec, hyprlab menu walls #All wallpapers menu
bind = $mainMod, PRINT, exec, hyprshot -m window #Screenshot a window
bind = , PRINT, exec, hyprshot -m output #ScreenShot a screen
bind = $shiftMod, PRINT, exec, hyprshot -m region #ScreenShot a region

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l #move focus to left
bind = $mainMod, right, movefocus, r #move focus to right
bind = $mainMod, up, movefocus, u #move focus to up
bind = $mainMod, down, movefocus, d #move focus to down

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, F1, workspace, 1 #Switch to workspace 1
bind = $mainMod, F2, workspace, 2 #Switch to workspace 2
bind = $mainMod, F3, workspace, 3 #Switch to workspace 3
bind = $mainMod, F4, workspace, 4 #Switch to workspace 4
bind = $mainMod, F5, workspace, 5 #Switch to workspace 5
bind = $mainMod, F6, workspace, 6 #Switch to workspace 6
bind = $mainMod, F7, workspace, 7 #Switch to workspace 7
bind = $mainMod, F8, workspace, 8 #Switch to workspace 8
bind = $mainMod, F9, workspace, 9 #Switch to workspace 9
bind = $mainMod, F10, workspace, 10 #Switch to workspace 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, F1, movetoworkspace, 1 #Move active window to workspace 1
bind = $mainMod SHIFT, F2, movetoworkspace, 2 #Move active window to workspace 2
bind = $mainMod SHIFT, F3, movetoworkspace, 3 #Move active window to workspace 3
bind = $mainMod SHIFT, F4, movetoworkspace, 4 #Move active window to workspace 4
bind = $mainMod SHIFT, F5, movetoworkspace, 5 #Move active window to workspace 5
bind = $mainMod SHIFT, F6, movetoworkspace, 6 #Move active window to workspace 6
bind = $mainMod SHIFT, F7, movetoworkspace, 7 #Move active window to workspace 7
bind = $mainMod SHIFT, F8, movetoworkspace, 8 #Move active window to workspace 8
bind = $mainMod SHIFT, F9, movetoworkspace, 9 #Move active window to workspace 9
bind = $mainMod SHIFT, F10, movetoworkspace, 10 #Move active window to workspace 10

bind = $mainMod SHIFT, N, togglespecialworkspace, ai #Chat GPT workspace

bind = $mainMod, mouse_down, workspace, e+1 #Scroll down workspaces
bind = $mainMod, mouse_up, workspace, e-1 #Scroll up workspaces

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow #move a window 
bindm = $mainMod, mouse:273, resizewindow #rezize a window

