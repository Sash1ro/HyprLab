source = ~/.config/hyprlab/hyprland/conf/colors.conf

background {
    monitor =
    path = ~/.config/hyprlab/themes/current/wallpaper
    blur_passes = 3
    contrast = 0.8915
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    ignore_empty_input = true
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb($text)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99"> Enter Pass</span></i>
    hide_input = false
    position = 0, 400
    halign = center
    valign = bottom
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo -e "$TIME"
    color = rgb($text)
    font_size = 150
    font_family = SF Pro Display bold
    position = 0, -100
    halign = center
    valign = top
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    #DATE
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = rgb($text)
    font_size = 45
    font_family = SF Pro Display bold
    position = 0, -310
    halign = center
    valign = top
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    #Musique
    text = cmd[update:1000] echo "$(~/.config/hyprlab/scripts/utils/song.sh none)"
    color = rgb($text)
    font_size = 18
    font_family = SF Pro Display bold
    position = 0,-20
    halign = center
    valign = top
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    #USER
    text = Hi, $USER
    color = rgb($text)
    font_size = 20
    font_family = SF Pro Display bold
    position = 0,500
    halign = center
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
