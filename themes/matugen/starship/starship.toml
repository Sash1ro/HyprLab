add_newline = false
command_timeout = 60
format = """\
$os\
$directory \
$git_branch$git_status\
$line_break\
$character\
"""

right_format = """\
$time\
"""

palette = "colors"

[palettes.colors]
mustard = '#af8700' # example
primary = '#81d4dc'
color2 = '#00363b'
color3 = '#bec8c9'
color4 = '#1a2121'
color5 = '#00363b'
color6 = '#0e1415'
color7 = '#0e1415'
color8 = '#81d4dc'
color9 = '#b7c7ea'

[directory]
style = "fg:#81d4dc bold" 
home_symbol = ""
read_only = "󰌾"
read_only_style = "fg:red" 
fish_style_pwd_dir_length = 2
format = "[ $path ]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Desktop" = " "
"Documents" = ""
"Downloads" = ""
"Music" = "󰎈"
"Pictures" = ""
"Images" = ""
"Videos" = ""
"Vidéos" = ""
"GitHub" = "󰊤"
"vaults" = "󰂺"
"personal" = "󰛓"
".config" = ""

[character]
success_symbol = '[](fg:#81d4dc bold)'
error_symbol = '[](fg:#ffb4ab bold)'
vicmd_symbol = '[](fg:#0e1415 bold)'

[git_branch]
style = "fg:#b7c7ea bold" # color9 (red)
format = '[$symbol$branch]($style) '

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[($all_status$ahead_behind )](fg:#ea6962)]($style)'
# style = "bg:#394260"

[os]
format = "[$symbol]($style)"
style = "fg:#81d4dc bold" # color8
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
