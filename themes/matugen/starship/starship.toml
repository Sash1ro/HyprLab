add_newline = false
command_timeout = 60
format = """\
$os \
$directory \
$git_branch$git_status\
$line_break\
$character\
"""

right_format = """\
$time\
"""

palette = "colors"

[palettes.colors]
mustard = '#af8700' # example
color1 = '#acc7ff'
color2 = '#0f2f60'
color3 = '#c4c6d0'
color4 = '#1e2025'
color5 = '#0f2f60'
color6 = '#111318'
color7 = '#111318'
color8 = '#acc7ff'
color9 = '#debcdf'

[directory]
style = "fg:#acc7ff bold" 
home_symbol = "  "
read_only = " 󰌾 "
read_only_style = "fg:#ea6962" 
fish_style_pwd_dir_length = 2
format = "[$path]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Desktop" = "   "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Images" = "  "
"Videos" = "  "
"Vidéos" = "  "
"GitHub" = " 󰊤 "
"vaults" = " 󰂺 "
"personal" = " 󰛓 "
".config" = "  "

[character]
success_symbol = '[](fg:#acc7ff bold)'
error_symbol = '[](fg:#ffb4ab bold)'
vicmd_symbol = '[](fg:#111318 bold)'

[git_branch]
style = "fg:#debcdf bold" # color9 (red)
format = '[$symbol$branch]($style) '

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[($all_status$ahead_behind )](fg:#ea6962)]($style)'
# style = "bg:#394260"

[os]
format = "[$symbol]($style)"
style = "fg:#acc7ff bold" # color8
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
Arch = " "
