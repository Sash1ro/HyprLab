add_newline = false
command_timeout = 60
format = """\
$os\
$directory \
$git_branch$git_status\
$line_break\
$character\
"""

right_format = """\
$time\
"""

palette = "colors"

[palettes.colors]
primary = '#E95678'
red = '#e2204d'
green = '#135e6d'
text = '#D5D8DA'
mauve = '#b16286'
blue = '#26BBD9'


[directory]
style = "fg:primary bold" 
home_symbol = ""
read_only = "󰌾"
read_only_style = "fg:red" 
fish_style_pwd_dir_length = 2
format = "[ $path ]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Desktop" = " "
"Documents" = ""
"Downloads" = ""
"Music" = "󰎈"
"Pictures" = ""
"Images" = ""
"Videos" = ""
"Vidéos" = ""
"GitHub" = "󰊤"
"vaults" = "󰂺"
"personal" = "󰛓"
".config" = ""

[character]
success_symbol = '[](fg:primary bold)'
error_symbol = '[](fg:red bold)'
vicmd_symbol = '[](fg:green bold)'

[git_branch]
style = "fg:mauve bold"
format = '[$symbol$branch]($style) '

[git_status]
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
format = '[[($all_status$ahead_behind )](fg:red)]($style)'

[os]
format = "[$symbol]($style)"
style = "fg:primary bold" # color8
disabled = false

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
